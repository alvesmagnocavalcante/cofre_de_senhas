{% extends 'base.html' %}
{% block title %}Criar conta | Carmel Hotéis{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">CARMEL</p>
  <h1>Crie sua conta</h1>
  <form method="post" class="form-stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button primary" type="submit">Solicitar cadastro</button>
  </form>
  <p class="muted">Já possui conta? <a href="{% url 'login' %}">Entrar</a></p>
</section>
{% endblock %}
